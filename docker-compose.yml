version: "3.9"

services:
  kanx-api:
    build: .
    image: kanx:latest
    container_name: kanx-api
    ports:
      - "8000:8000"
    environment:
      - KANX_CONFIG=/app/configs/default.yaml
      - KANX_CHECKPOINT=/app/checkpoints/kanx_model.keras
      - KANX_MAX_BATCH=4096
    volumes:
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped

